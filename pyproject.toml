[project]
name = "data-seeding-pipeline"
version = "0.1.0"
description = "Deterministic, relational, PII-sanitized test data seeding pipeline for financial APIs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faker>=33.0.0",
    "pydantic>=2.10.0",
    "rich>=13.9.0",
    "typer>=0.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_seeding_pipeline"]

[project.scripts]
seed-pipeline = "data_seeding_pipeline.cli:app"

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["generate_assets.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "PL", "RUF"]
ignore = ["PLR0913", "PLR0917", "PLR2004"]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.17.0",
]
